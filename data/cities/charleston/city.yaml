# Shown in "My Trip". Marked as sample until checked.
gettingAround:
  - Downtown's DASH trolleys have been free to ride. Park once and hop on with the stroller (confirm routes on the CARTA site).
  - Rideshares rarely come with car seats. With a toddler and a baby, plan to drive yourself.
  - The bridges to Mount Pleasant and James Island back up around 4:30–6:30 PM on weekdays.
  - City garages have a flat daily maximum, usually less stress than hunting for King St meters.
