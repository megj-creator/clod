whyFound: >-
  One of the oldest living things in the eastern US, possibly 400+ years
  old. It's a quick stop, but standing under it is genuinely moving.
insiderTip: >-
  This is a 20-minute visit, not a half-day. Pair it with a Johns Island farm stand
  or the drive out to Kiawah.

localsSay:
  text: >-
    Locals love it but warn that it's short: go, look up, leave. Some grumble about
    weekend crowds.
  sourced: false

