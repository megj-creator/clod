whyFound: >-
  A family-run oyster shack on a marsh island that's been going since the 1940s.
  Plywood, paper towels, sunset over the water. This is the Lowcountry that locals
  are proudest of.
insiderTip: >-
  Come for sunset and sit out on the dock. Oyster season runs roughly fall to spring.
  In summer, go for the fried shrimp.

localsSay:
  text: >-
    Locals say go for the setting and the tradition, and don't dress up.
