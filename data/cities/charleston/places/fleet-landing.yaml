whyFound: >-
  Popular with tourists, yes. But the water view is real, the Lowcountry
  classics are done right, and it's an easy yes when you want "we're in Charleston"
  food without a dress code.
insiderTip: >-
  Ask for the deck at lunch, when it's calmer than dinner and the harbor light is
  best. Share the fried green tomatoes.

localsSay:
  text: >-
    Locals call it a solid pick for visiting family: reliable and scenic, if not the most
    inventive. Some prefer lunch to skip the dinner crowds.
