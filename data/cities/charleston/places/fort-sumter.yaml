whyFound: >-
  The boat ride across the harbor is half the fun, and standing in the fort where the war started is powerful.
insiderTip: >-
  Sit on the upper deck for dolphins. Bring layers, because it's windy on the water.

localsSay:
  text: >-
    Locals say do it once. The boat ride is the highlight for kids.
