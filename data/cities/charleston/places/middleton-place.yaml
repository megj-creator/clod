whyFound: >-
  Formal, symmetrical gardens rolling down to butterfly lakes, plus a working stableyard. It's the elegant counterpart to wilder Magnolia.
insiderTip: >-
  The restaurant on site does a great Lowcountry lunch. Take the Beyond the Fields tour for the full history.

localsSay:
  text: >-
    Locals tend to pick Middleton for formal gardens and Magnolia for wild ones.
