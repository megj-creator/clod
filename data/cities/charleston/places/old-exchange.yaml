whyFound: >-
  A 45-minute history hit that works in the rain and doesn't ask little legs to
  go far. The dungeon, a brick-vaulted cellar under the building, is the part you'll remember.
insiderTip: >-
  Do the dungeon first, while the toddler is still curious. The guided talk down
  there is short and theatrical. Step out if the mannequins are too spooky.

localsSay:
  text: >-
    Locals recommend it as the best "one hour, indoors, downtown" history stop,
    especially for kids who won't last through a historic house tour.
  sourced: false

realityCheck:
  hours: Typically 9 AM–5 PM daily
