whyFound: >-
  The kind of place you'd never find on a top-10 list. It burned twice, in 1779 and
  again in 1865, and nature took what was left. Eerie, beautiful, and almost always quiet.
insiderTip: >-
  Pair it with lunch in Beaufort, 30 minutes further on, so the drive is worth it.
  Leave at nap time and the drive becomes the nap.

localsSay:
  text: >-
    Photographers and history buffs treat it like a pilgrimage. Locals ask visitors to
    be respectful: it's still church property, not a photo set.
  sourced: false

realityCheck:
  hours: Grounds generally open during daylight
  seasonal: Year-round. Mosquitoes and gnats in summer.
  warnings:
