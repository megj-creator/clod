whyFound: >-
  The locals' favorite free sunset: a car-free stretch of old bridge that runs out
  into the marsh. Flat and stroller-friendly, and the Old Village around it is one
  of the prettiest neighborhoods in the area.
insiderTip: >-
  Grab an ice cream in the Old Village, then walk out 20 minutes before sunset.
  Watch the creek for dolphins.

