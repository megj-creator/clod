whyFound: >-
  The barbecue locals actually drive to. No reservations, no dress code, paper
  towels on the table. Low stakes with a toddler, and the food is genuinely great.
insiderTip: >-
  Order at the counter and load up on sauces. Get the brisket plus pulled pork
  combo to share. On weekends, go before 6 to beat the line.

localsSay:
  text: >-
    Usually named in the same breath as Rodney Scott's and Lewis in the endless
    "best BBQ" debate. It's praised more for consistency and the easy family vibe than for being a destination.
