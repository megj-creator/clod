whyFound: >-
  The fountain everyone photographs is also one toddlers are allowed to splash
  in. Add the big family swings out on the pier and it's the easiest free hour downtown.
insiderTip: >-
  Bring a towel and a change of clothes. In the late afternoon, the pier swings
  catch the breeze and the best light.

